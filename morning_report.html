.card.s .val{color:#7030A0}.card.c .val{color:#c62828}.card.o .val{color:#e65100}
.sec{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid #e2e4e9;margin-bottom:24px;overflow:hidden}
.sec-h{padding:16px 20px;border-bottom:1px solid #e2e4e9}
.sec-h h2{font-size:18px;font-weight:700}
.tabs{display:flex;border-bottom:2px solid #e2e4e9;background:#fafbfc}
.tab{padding:12px 24px;cursor:pointer;font-size:14px;font-weight:600;color:#5a5a7a;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s}
.tab:hover{color:#1a1a2e;background:#f0f1f3}
.tab.act{background:transparent}
.tab.act[data-d="teva"]{border-bottom-color:#7030A0;color:#7030A0}
.tab.act[data-d="sugar"]{border-bottom-color:#C55A11;color:#C55A11}
.tab.act[data-d="salt"]{border-bottom-color:#548235;color:#548235}
.tc{display:none}.tc.act{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 16px;background:#f7f8fa;font-weight:600;color:#5a5a7a;font-size:12px;border-bottom:2px solid #e2e4e9;white-space:nowrap;text-align:center}
td{padding:10px 16px;border-bottom:1px solid #f0f1f3;text-align:center}
th:first-child,td:first-child{text-align:right}
tr:hover{background:#fafbfc}
.pw{display:flex;align-items:center;gap:6px;justify-content:center}
.pb{flex:1;height:8px;background:#eee;border-radius:4px;overflow:hidden;max-width:70px}
.pf{height:100%;border-radius:4px}
.pp{font-size:12px;font-weight:600;min-width:36px;text-align:left;direction:ltr}
.pg{color:#2d8a4e}.pm{color:#e65100}.pl{color:#c62828}
.fg{background:#2d8a4e}.fm{background:#e65100}.fl{background:#c62828}
.dt td{font-weight:700;background:#f7f8fa;border-top:2px solid #e2e4e9}
.cr{cursor:pointer;transition:.15s}.cr:hover{background:#f5f6f8}
.ca{display:inline-block;transition:transform .2s;font-size:11px;margin-left:6px}
.cr.op .ca{transform:rotate(90deg)}
.id{display:none}.id.sh{display:table-row}
.id td{padding:0;background:#fafbfc}
.iw{padding:8px 20px 12px}
.iw table{font-size:12px}.iw th{background:#f0f1f3;font-size:11px}.iw td{padding:7px 10px}
.oh{color:#c62828;font-weight:700}.om{color:#e65100;font-weight:600}
.oo{color:#c62828;font-weight:700}
.note{padding:10px 20px;font-size:11px;color:#999;border-top:1px solid #e2e4e9}
@media(max-width:768px){.summary{grid-template-columns:1fr}.tab{padding:10px 14px;font-size:13px}body{padding:12px}td,th{padding:8px 8px}}
</style>

const f=n=>Math.round(n).toLocaleString('he-IL');
const fk=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':f(n);
function bar(p){const c=p>=70?'g':p>=30?'m':'l';return `<div class="pw"><div class="pb"><div class="pf f${c}" style="width:${Math.min(p,100)}%"></div></div><span class="pp p${c}">${p.toFixed(0)}%</span></div>`;}
const dp=D.date.split('-');
document.getElementById('rd').textContent=`${dp[2]}/${dp[1]}/${dp[0]}`;
document.getElementById('ut').textContent='עודכן '+D.time;
const depts=Object.keys(D.sales);let gt=0;const dt={};
depts.forEach(d=>{const t=D.sales[d].reduce((s,i)=>s+i.s,0);dt[d]=t;gt+=t});
document.getElementById('ts').textContent='₪'+f(gt);
document.getElementById('sb').textContent=depts.map(d=>d+': ₪'+fk(dt[d])).join(' | ');
const ct=D.coll.reduce((s,c)=>s+c.t,0);
document.getElementById('tc').textContent=D.coll.length+' לקוחות';
document.getElementById('cs').textContent='סה"כ ₪'+f(ct);
document.getElementById('to').textContent=D.obl.length+' חורגים';
document.getElementById('os').textContent='סה"כ חריגה ₪'+f(D.obl.reduce((s,o)=>s+(o.oi-o.cr),0));
const stb=document.getElementById('stb'),sc=document.getElementById('sc');
const dm={"טבע-עוז":"teva","סוכר":"sugar","מלח":"salt"};
depts.forEach((dept,i)=>{
  const tab=document.createElement('div');tab.className='tab'+(i===0?' act':'');tab.dataset.d=dm[dept];tab.textContent=dept;
  tab.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('act'));document.querySelectorAll('.tc').forEach(t=>t.classList.remove('act'));tab.classList.add('act');document.getElementById('s'+i).classList.add('act')};
  stb.appendChild(tab);
  const div=document.createElement('div');div.className='tc'+(i===0?' act':'');div.id='s'+i;
  let h=`<table><thead><tr><th style="width:20%;text-align:right">מוצר</th><th style="width:10%">כמות ביצוע</th><th style="width:10%">כמות תכנון</th><th style="width:13%">% כמות</th><th style="width:12%">כספי ביצוע</th><th style="width:12%">כספי תכנון</th><th style="width:13%">% כספי</th><th style="width:10%">מחיר ממוצע</th></tr></thead><tbody>`;
  let tpq=0,taq=0,tps=0,tas=0;
  D.sales[dept].forEach(item=>{const qp=item.pq>0?(item.q/item.pq*100):0;const sp=item.ps>0?(item.s/item.ps*100):0;const ap=item.q>0?(item.s/item.q):0;tpq+=item.pq;taq+=item.q;tps+=item.ps;tas+=item.s;
    h+=`<tr><td style="text-align:right">${item.n}</td><td>${f(item.q)}</td><td>${f(item.pq)}</td><td>${item.pq>0?bar(qp):'—'}</td><td>₪${f(item.s)}</td><td>₪${f(item.ps)}</td><td>${item.ps>0?bar(sp):'—'}</td><td>₪${ap.toFixed(1)}</td></tr>`});
  h+=`<tr class="dt"><td style="text-align:right">סה"כ ${dept}</td><td>${f(taq)}</td><td>${f(tpq)}</td><td>${tpq>0?bar(taq/tpq*100):'—'}</td><td>₪${f(tas)}</td><td>₪${f(tps)}</td><td>${tps>0?bar(tas/tps*100):'—'}</td><td></td></tr></tbody></table>`;
  div.innerHTML=h;sc.appendChild(div)});
const cbEl=document.getElementById('cb');
D.coll.forEach((c,i)=>{const ms=c.mx>=90?'oh':c.mx>=30?'om':'';const row=document.createElement('tr');row.className='cr';
  row.onclick=()=>{row.classList.toggle('op');document.getElementById('i'+i).classList.toggle('sh')};
  row.innerHTML=`<td style="text-align:right"><span class="ca">▸</span> ${c.n}</td><td>₪${f(c.t)}</td><td>${c.c}</td><td>${c.mn}</td><td class="${ms}">${c.mx}</td>`;cbEl.appendChild(row);
  const dr=document.createElement('tr');dr.className='id';dr.id='i'+i;
  let ih='<td colspan="5"><div class="iw"><table><thead><tr><th>חשבונית</th><th>תאריך</th><th>פירעון</th><th>יתרה</th><th>ימים</th></tr></thead><tbody>';
  c.iv.forEach(v=>{const ds=v.y>=90?'oh':v.y>=30?'om':'';ih+=`<tr><td>${v.u}</td><td>${v.d}</td><td>${v.e}</td><td>₪${f(v.a)}</td><td class="${ds}">${v.y}</td></tr>`});
  ih+='</tbody></table></div></td>';dr.innerHTML=ih;cbEl.appendChild(dr)});
const obEl=document.getElementById('ob');
[...D.obl].sort((a,b)=>(b.oi/b.cr)-(a.oi/a.cr)).forEach(o=>{const p=(o.oi/o.cr*100),ov=o.oi-o.cr;
  obEl.innerHTML+=`<tr><td style="text-align:right">${o.n}</td><td>₪${f(o.cr)}</td><td>₪${f(o.oi)}</td><td class="oo">${p.toFixed(0)}%</td><td class="oo">₪${f(ov)}</td></tr>`});
